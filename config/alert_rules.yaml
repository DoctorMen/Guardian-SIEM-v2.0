# ============================================================
# Guardian SIEM v2.0 — Alert Rules Engine Configuration
# ============================================================
# Each rule defines a pattern to match against incoming events.
# When matched, the rule triggers an alert with the specified severity.
#
# Fields:
#   name          - Human-readable rule name
#   description   - What the rule detects
#   source        - Event source to match (regex supported)
#   pattern       - Regex pattern to match against event message
#   severity      - Alert severity: CRITICAL, HIGH, MEDIUM, LOW, INFO
#   mitre_id      - MITRE ATT&CK technique ID
#   mitre_tactic  - MITRE ATT&CK tactic
#   threshold     - Number of matches in window before alerting (optional)
#   window_seconds- Time window for threshold counting (optional)
#   group_by      - Extracted field the threshold is counted per, e.g. IpAddress
#                   (optional; see field_extractor.py for field names)
#   enabled       - Whether this rule is active

rules:
  - name: "Brute Force Detection"
    description: "Five failed logons from the same source address within a minute"
    source: ".*"
    pattern: "(Event ID 4625\\b|failed login|authentication failure|logon failure)"
    severity: "HIGH"
    mitre_id: "T1110"
    mitre_tactic: "Credential Access"
    threshold: 5
    window_seconds: 60
    group_by: "IpAddress"
    enabled: true

  - name: "Port Scan Detection"
    description: "Twenty unanswered connection attempts from one source within 10 seconds"
    source: "Network"
    pattern: "(Flags: S\\. Reply: none|port scan|SYN scan)"
    severity: "MEDIUM"
    mitre_id: "T1046"
    mitre_tactic: "Discovery"
    threshold: 20
    window_seconds: 10
    group_by: "IpAddress"
    enabled: true

  - name: "High Traffic Anomaly"
    description: "Unusually high packet rate from a single source"
    source: "Network_IPS"
    pattern: "(high traffic|flood|DDoS)"
    severity: "HIGH"
    mitre_id: "T1498"
    mitre_tactic: "Impact"
    threshold: 1
    window_seconds: 5
    enabled: true

  - name: "Privilege Escalation"
    description: "Special privileges assigned to a logon session"
    source: ".*"
    pattern: "(4672|special privilege|SeDebugPrivilege|SeTcbPrivilege)"
    severity: "MEDIUM"
    mitre_id: "T1078"
    mitre_tactic: "Privilege Escalation"
    threshold: 1
    window_seconds: 300
    # Disabled: 4672 is logged on every administrator logon, so on its own it
    # is not an alert (see config/validation/benign_events.yml). Kept for hunting.
    enabled: false

  - name: "Log Tampering"
    description: "Security audit log was cleared"
    source: ".*"
    pattern: "(Event ID 1102\\b|audit log.*cleared|event log.*cleared)"
    severity: "CRITICAL"
    mitre_id: "T1070.001"
    mitre_tactic: "Defense Evasion"
    threshold: 1
    window_seconds: 1
    enabled: true

  - name: "Suspicious Service Installation"
    description: "Service installed from a user-writable path or launched through a shell"
    source: ".*"
    pattern: "Event ID 7045\\b.*Service File Name: .*(\\\\ProgramData\\\\|\\\\Users\\\\Public\\\\|\\\\AppData\\\\|\\\\Temp\\\\|powershell|cmd(\\.exe)? /c)"
    severity: "HIGH"
    mitre_id: "T1543.003"
    mitre_tactic: "Persistence"
    threshold: 1
    window_seconds: 60
    enabled: true

  - name: "Reverse Shell Indicator"
    description: "Command line that opens an interactive shell over a TCP socket"
    source: ".*"
    pattern: "(bash -i >& ?/dev/tcp/|/dev/tcp/[0-9.]+/[0-9]+|\\bnc(\\.exe)? .*-e |\\bncat(\\.exe)? .*-e |Net\\.Sockets\\.TCPClient\\()"
    severity: "CRITICAL"
    mitre_id: "T1059"
    mitre_tactic: "Execution"
    threshold: 1
    window_seconds: 1
    enabled: true

  - name: "Data Exfiltration Indicator"
    description: "A single flow sends 100 MB or more to an address outside RFC 1918 space"
    source: "Network"
    pattern: "DstIp: (?!10\\.|192\\.168\\.|172\\.(1[6-9]|2[0-9]|3[01])\\.)[0-9.]+\\..*BytesOut: [1-9][0-9]{8,}\\b"
    severity: "HIGH"
    mitre_id: "T1041"
    mitre_tactic: "Exfiltration"
    threshold: 1
    window_seconds: 300
    enabled: true

  - name: "Unauthorized Access Attempt"
    description: "Access attempt to restricted resource"
    source: ".*"
    pattern: "(unauthorized|403|access denied|permission denied)"
    severity: "MEDIUM"
    mitre_id: "T1078"
    mitre_tactic: "Initial Access"
    threshold: 3
    window_seconds: 60
    enabled: true

  - name: "Malware Signature Match"
    description: "Known malware indicator detected"
    source: ".*"
    pattern: "(malware|trojan|ransomware|cryptominer|mimikatz|lazagne|bloodhound)"
    severity: "CRITICAL"
    mitre_id: "T1204"
    mitre_tactic: "Execution"
    threshold: 1
    window_seconds: 1
    enabled: true

  # ==================================================================
  # Purple Team Rules - Attack Simulator Detection Coverage
  # ==================================================================

  - name: "Kerberoasting Detection"
    description: "Two RC4 service tickets for user (non-computer) accounts from one client in 30 seconds"
    source: ".*"
    pattern: "Event ID 4769\\b.*Service Name: (?!krbtgt\\.)[^ $]+\\. .*Ticket Encryption Type: 0x17\\b"
    severity: "HIGH"
    mitre_id: "T1558.003"
    mitre_tactic: "Credential Access"
    threshold: 2
    window_seconds: 30
    group_by: "IpAddress"
    enabled: true

  - name: "LSASS Credential Access"
    description: "A process other than Defender opens LSASS with memory-read access rights"
    source: ".*"
    pattern: "^(?!.*\\\\Windows Defender\\\\).*TargetImage: .*\\\\lsass\\.exe\\. .*GrantedAccess: 0x(1010|1410|1438|143a|1fffff)\\b"
    severity: "CRITICAL"
    mitre_id: "T1003"
    mitre_tactic: "Credential Access"
    threshold: 1
    window_seconds: 1
    enabled: true

  - name: "Ransomware File Encryption"
    description: "Files written with a ransomware extension, or a ransom note dropped"
    source: ".*"
    pattern: "TargetFilename: .*(\\.(encrypted|locked|crypt)$|\\\\(README_DECRYPT|RECOVER_FILES|HOW_TO_DECRYPT)[^\\\\]*$)"
    severity: "CRITICAL"
    mitre_id: "T1486"
    mitre_tactic: "Impact"
    threshold: 1
    window_seconds: 1
    enabled: true

  - name: "Shadow Copy Deletion"
    description: "Volume shadow copies deleted - common ransomware precursor"
    source: ".*"
    pattern: "(vssadmin(\\.exe)? delete shadows|wmic(\\.exe)? shadowcopy delete|bcdedit(\\.exe)? .*recoveryenabled +no)"
    severity: "CRITICAL"
    mitre_id: "T1490"
    mitre_tactic: "Impact"
    threshold: 1
    window_seconds: 1
    enabled: true

  - name: "RDP Lateral Movement"
    description: "One source opens RDP sessions (logon type 10) twice within 10 minutes"
    source: ".*"
    pattern: "Event ID 4624\\b.*Logon Type: ?10\\b"
    severity: "HIGH"
    mitre_id: "T1021.001"
    mitre_tactic: "Lateral Movement"
    threshold: 2
    window_seconds: 600
    group_by: "IpAddress"
    enabled: true

  - name: "DNS Exfiltration"
    description: "Ten DNS queries with a 40+ character encoded-looking label from one source"
    source: ".*"
    pattern: "QueryName: [A-Za-z0-9+/=_-]{40,}\\."
    severity: "HIGH"
    mitre_id: "T1048.003"
    mitre_tactic: "Exfiltration"
    threshold: 10
    window_seconds: 600
    group_by: "IpAddress"
    enabled: true

  - name: "PowerShell Download Cradle"
    description: "PowerShell downloading and executing remote payloads"
    source: ".*"
    pattern: "(downloadstring|Invoke-WebRequest.*-OutFile|Net\\.WebClient.*download|IEX.*New-Object)"
    severity: "CRITICAL"
    mitre_id: "T1059.001"
    mitre_tactic: "Execution"
    threshold: 1
    window_seconds: 1
    enabled: true

  - name: "C2 Beacon Communication"
    description: "Established outbound connection to a port commonly used by C2 frameworks"
    source: ".*"
    pattern: "DstPort: (4444|1337|31337|50050)\\b.*Reply: established"
    severity: "CRITICAL"
    mitre_id: "T1071"
    mitre_tactic: "Command and Control"
    threshold: 1
    window_seconds: 1
    enabled: true
