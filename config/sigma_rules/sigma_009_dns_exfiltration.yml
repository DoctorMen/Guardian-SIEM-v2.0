title: DNS Query With an Encoded Label
id: 4c3b2a1f-0e9d-8c7b-6a5f-4e3d2c1b0a9f
status: stable
level: high
description: >
    Detects DNS queries whose first label is 40 or more base64- or hex-like
    characters. Tools that tunnel data over DNS pack each chunk into the
    subdomain, which produces labels far longer than normal hostnames.
author: Guardian SIEM
date: 2025/02/13
tags:
    - attack.exfiltration
    - attack.t1048.003
references:
    - https://attack.mitre.org/techniques/T1048/003/
logsource:
    product: network
    service: dns
detection:
    selection:
        QueryName|re: '^[A-Za-z0-9+/=_-]{40,}\.'
    condition: selection
falsepositives:
    - High-volume DNS resolvers
    - Content delivery networks with many subdomains
    - Legitimate SaaS applications with dynamic DNS
