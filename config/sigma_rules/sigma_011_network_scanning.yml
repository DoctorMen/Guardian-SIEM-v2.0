title: Port Scan Reported by Passive IPS
id: 6e7f8091-2a3b-4c5d-6e7f-8091a2b3c4d5
status: stable
level: medium
description: >
    Raises the port-scan summary that passive_ips.py emits (it counts unique
    destination ports per source) to a Sigma alert. Single SYN packets are not
    matched here; counting raw connection attempts per source is done by the
    native "Port Scan Detection" threshold rule.
author: Guardian SIEM
date: 2025/02/13
tags:
    - attack.discovery
    - attack.t1046
references:
    - https://attack.mitre.org/techniques/T1046/
logsource:
    product: network
    service: firewall
detection:
    selection:
        - "Port scan detected from"
        - "Port scan summary"
    condition: selection
falsepositives:
    - Vulnerability scanners (Nessus, Qualys)
    - Network monitoring tools
    - Load balancer health checks
