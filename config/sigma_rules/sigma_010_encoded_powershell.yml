title: Encoded PowerShell Command - Base64
id: 5d6e7f80-1a2b-3c4d-5e6f-708192a3b4c5
status: stable
level: high
description: >
    Detects PowerShell started with a base64-encoded command (-e, -enc,
    -EncodedCommand and their abbreviations), a common way to hide a payload
    from command-line logging. -NoProfile on its own is not matched, because
    scheduled scripts use it all the time.
author: Guardian SIEM
date: 2025/02/13
tags:
    - attack.execution
    - attack.defense_evasion
    - attack.t1059.001
    - attack.t1027
references:
    - https://attack.mitre.org/techniques/T1059/001/
    - https://attack.mitre.org/techniques/T1027/
logsource:
    product: windows
    category: process_creation
detection:
    selection_image:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
    selection_encoded:
        CommandLine|re: '\s-e(c|nc|nco|ncod|ncode|ncoded|ncodedc|ncodedcommand)?\s+[A-Za-z0-9+/=]{8,}'
    condition: selection_image and selection_encoded
falsepositives:
    - SCCM/Intune deployment scripts
    - Configuration management tools encoding parameters
