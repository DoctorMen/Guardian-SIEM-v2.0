title: LSASS Memory Access - Credential Dumping
id: 7b3f5e1a-9c2d-4a8b-b6e0-3d4c5a7f8e9b
status: stable
level: critical
description: >
    Detects a process opening LSASS with access rights that allow reading its
    memory (PROCESS_VM_READ combined with query rights), which is how Mimikatz
    and similar tools extract credentials. Query-only access such as 0x1000
    (Task Manager) is not matched. Defender and core Windows processes are
    filtered by full path, so a copy of svchost.exe elsewhere is still caught.
author: Guardian SIEM
date: 2025/02/13
tags:
    - attack.credential_access
    - attack.t1003
    - attack.t1003.001
references:
    - https://attack.mitre.org/techniques/T1003/001/
    - https://www.ired.team/offensive-security/credential-access-and-credential-dumping/dump-credentials-from-lsass-process-without-mimikatz
logsource:
    product: windows
    category: process_access
detection:
    selection:
        EventID: 10
        TargetImage|endswith: '\lsass.exe'
        GrantedAccess:
            - '0x1010'
            - '0x1410'
            - '0x1438'
            - '0x143a'
            - '0x1fffff'
    filter_defender:
        SourceImage|contains: '\Windows Defender\'
    filter_system:
        SourceImage:
            - 'C:\Windows\System32\csrss.exe'
            - 'C:\Windows\System32\wininit.exe'
            - 'C:\Windows\System32\services.exe'
            - 'C:\Windows\System32\svchost.exe'
    condition: selection and not filter_defender and not filter_system
falsepositives:
    - Windows Defender performing memory scans
    - Legitimate AV products scanning process memory
    - Windows Error Reporting (WerFault.exe)
