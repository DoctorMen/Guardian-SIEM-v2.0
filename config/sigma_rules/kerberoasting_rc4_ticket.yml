title: Kerberoasting - RC4 Service Ticket Request
id: 8b5e1e2f-3a4d-4c6e-9f8a-1b2c3d4e5f6a
status: stable
level: high
description: >
    Detects Kerberos service tickets (event 4769) issued with RC4-HMAC (0x17)
    for user service accounts. Kerberoasting asks for RC4 because it is the
    fastest ticket type to crack offline. Tickets for computer accounts (names
    ending in $) are excluded: their passwords are random and long, and older
    domains still issue RC4 for them.
author: Guardian SIEM
date: 2025/02/13
tags:
    - attack.credential_access
    - attack.t1558.003
references:
    - https://attack.mitre.org/techniques/T1558/003/
    - https://adsecurity.org/?p=2293
logsource:
    product: windows
    service: security
detection:
    selection:
        EventID: 4769
        TicketEncryptionType: '0x17'
    filter_computer_accounts:
        ServiceName|endswith: '$'
    filter_krbtgt:
        ServiceName: 'krbtgt'
    condition: selection and not filter_computer_accounts and not filter_krbtgt
falsepositives:
    - Legacy applications requiring RC4
    - Service accounts with SPNs configured before AES migration
